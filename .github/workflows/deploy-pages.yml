name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static bundle for GitHub Pages
        run: |
          npx vite build --base=/navidad-2026-regalos-a-la-carta/
          node -e "import('./dist/server/index.js').then(async m => { const fs = await import('node:fs'); const res = await m.default.fetch(new Request('http://localhost/navidad-2026-regalos-a-la-carta/')); const html = await res.text(); fs.writeFileSync('dist/client/index.html', html); fs.writeFileSync('dist/client/404.html', html); fs.writeFileSync('dist/client/.nojekyll', ''); })"

      - name: Publish to gh-pages branch
        run: |
          cd dist/client
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy static build to gh-pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
