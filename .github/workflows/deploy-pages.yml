name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static bundle for GitHub Pages
        run: |
          npx vite build --base=/navidad-2026-regalos-a-la-carta/
          node -e "import('./dist/server/index.js').then(async m => { const fs = await import('node:fs'); const res = await m.default.fetch(new Request('http://localhost/navidad-2026-regalos-a-la-carta/')); const html = await res.text(); fs.writeFileSync('dist/client/index.html', html); fs.writeFileSync('dist/client/404.html', html); fs.writeFileSync('dist/client/.nojekyll', ''); })"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
