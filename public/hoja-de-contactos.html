<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hoja de Contactos Interactiva · 104 Tarjetas Navidad 2026</title>
  <style>
    :root {
      --cream: #f6f3ec;
      --wine: #8f3042;
      --pine: #2c593d;
      --olive: #6c7850;
      --gold: #bd9250;
      --ink: #383838;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Montserrat", system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--ink);
      padding-bottom: 60px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(255, 253, 248, 0.96);
      border-bottom: 1px solid rgba(143, 48, 66, 0.18);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(56, 56, 56, 0.06);
    }
    .topbar-title h1 {
      margin: 0;
      font-size: 18px;
      color: var(--wine);
    }
    .topbar-title p {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--olive);
    }
    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(143, 48, 66, 0.28);
      background: #fffdf8;
      color: var(--wine);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
    }
    .btn-primary {
      background: var(--wine);
      border-color: var(--wine);
      color: #fff;
      box-shadow: 0 6px 16px rgba(143, 48, 66, 0.25);
    }
    .btn-active {
      background: var(--pine);
      border-color: var(--pine);
      color: #fff;
    }
    .counter-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(189, 146, 80, 0.18);
      color: var(--wine);
      font-size: 12px;
      font-weight: 700;
    }
    .export-panel {
      display: none;
      max-width: 1280px;
      margin: 16px auto 0;
      padding: 16px 20px;
      border-radius: 16px;
      background: #fffdf8;
      border: 2px solid var(--wine);
      box-shadow: 0 12px 30px rgba(56, 56, 56, 0.1);
    }
    .export-panel.is-open {
      display: block;
    }
    .export-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .export-head strong {
      color: var(--wine);
      font-size: 14px;
    }
    .export-textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(143, 48, 66, 0.25);
      background: #faf7f0;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      resize: vertical;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 14px;
      max-width: 1320px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .card-item {
      user-select: none;
      background: #fffdf8;
      border: 1px solid rgba(143, 48, 66, 0.15);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 12px rgba(56, 56, 56, 0.05);
    }
    .card-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 56, 56, 0.1);
    }
    .card-item.is-rotated {
      border: 2px solid var(--wine);
      background: #fff9f5;
      box-shadow: 0 8px 22px rgba(143, 48, 66, 0.14);
    }
    .card-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .card-id {
      font-size: 13px;
      font-weight: 800;
      color: var(--wine);
      background: rgba(143, 48, 66, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .card-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--olive);
    }
    .img-wrap {
      width: 150px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #e6ded2;
      border-radius: 10px;
      overflow: hidden;
      padding: 10px;
    }
    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-name {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      line-height: 1.3;
      min-height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rot-badge {
      margin-top: 6px;
      width: 100%;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      background: #f0ebe1;
      color: var(--ink);
    }
    .card-item.is-rotated .rot-badge {
      background: var(--wine);
      color: #fff;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--pine);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
    }
    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Hoja de Contactos Interactiva · 104 Tarjetas</h1>
      <p>Haz clic en cualquier tarjeta para girarla 90° (0° → 90° → 180° → 270°). Luego pulsa "Exportar correcciones".</p>
    </div>
    <div class="topbar-actions">
      <span id="rotated-count" class="counter-pill">0 giradas</span>
      <button type="button" id="filter-all" class="btn btn-active">Todas (104)</button>
      <button type="button" id="filter-rotated" class="btn">Solo giradas</button>
      <button type="button" id="btn-reset" class="btn">Reiniciar a 0°</button>
      <button type="button" id="btn-export" class="btn btn-primary">Exportar correcciones</button>
    </div>
  </header>

  <section id="export-panel" class="export-panel" aria-live="polite">
    <div class="export-head">
      <strong>Listado de rotaciones (ID → grados) listo para copiar y pegar en el chat:</strong>
      <div>
        <button type="button" id="btn-copy" class="btn btn-primary">Copiar listado</button>
        <button type="button" id="btn-close-export" class="btn">Cerrar</button>
      </div>
    </div>
    <textarea id="export-output" class="export-textarea" readonly></textarea>
  </section>

  <main id="cards-grid" class="grid"></main>
  <div id="toast" class="toast">¡Copiado al portapapeles!</div>

  <script>
    const CARDS = [
      [1, "Inicial P"], [2, "Inicial B"], [3, "Inicial I"], [4, "Inicial N"],
      [5, "Inicial K"], [6, "Inicial T"], [7, "Inicial F"], [8, "Inicial Y"],
      [9, "Inicial M"], [10, "Inicial D"], [11, "Inicial H"], [12, "Ho Ho Ho escocés"],
      [13, "Inicial U"], [14, "Inicial O"], [15, "Ramo con esferas"], [16, "Puerta roja"],
      [17, "Vela de acebo"], [18, "Corona verde"], [19, "Pino con lazo"], [20, "Santa clásico"],
      [21, "Holly Jolly Merry Happy"], [22, "Warm Winter Wishes"], [23, "Merry Christmas to you"], [24, "Puerta de madera"],
      [25, "Petirrojo invernal"], [26, "Pesebre con animales"], [27, "Ho Ho Ho festivo"], [28, "Farol rojo"],
      [29, "Rama nevada"], [30, "Lazo escocés"], [31, "Guirnalda roja"], [32, "Sagrada Familia"],
      [33, "Merry Christmas colorido"], [34, "Ho Ho Ho muñeco"], [35, "Guirnalda de piñas"], [36, "Santa de pie"],
      [37, "Lazo marfil"], [38, "Merry Christmas gorro"], [39, "Merry Christmas acuarela"], [40, "Ho Ho Ho trineo"],
      [41, "Puertita navideña"], [42, "Ángel dorado"], [43, "Lazo con esferas"], [44, "Cinta candy"],
      [45, "Virgen y niño"], [46, "Moño rojo"], [47, "Farol y petirrojo"], [48, "Merry Christmas campanas"],
      [49, "Regalo a rayas"], [50, "Merry Christmas duende"], [51, "Cascabeles"], [52, "Arbolito en maceta"],
      [53, "Corona con moño"], [54, "Pino en cesta"], [55, "Ho! Ho! Ho!"], [56, "Traje de Santa"],
      [57, "Piñas de pino"], [58, "Ho! bastones"], [59, "María"], [60, "Jarrón invernal"],
      [61, "Casita roja"], [62, "Reno Merry Christmas"], [63, "Christmas caligrafía"], [64, "Pino dorado"],
      [65, "Santa bailarín"], [66, "Guirnalda con moño"], [67, "Merry Christmas arbolitos"], [68, "Rama de invierno"],
      [69, "Tronco festivo"], [70, "Frascos de eucalipto"], [71, "Love Christmas"], [72, "Carita de reno"],
      [73, "Feliz Ho Ho"], [74, "Ramillete"], [75, "Velas y poinsettia"], [76, "Ho Ho Ho Santa"],
      [77, "Vela de canela"], [78, "Merry Christmas bloque"], [79, "Angelitos"], [80, "Guirnalda natural"],
      [81, "Arbolito de corazones"], [82, "Sagrada Familia acuarela"], [83, "Merry Christmas acebo"], [84, "Feliz Navidad en auto"],
      [85, "Renito tierno"], [86, "Osito navideño"], [87, "Merry Christmas ilustrado"], [88, "Estrellas colgantes"],
      [89, "Gnomo en trineo"], [90, "Gnomo estrella"], [91, "Estrella roja"], [92, "Santa North Pole"],
      [93, "Calcetines rojos"], [94, "Calcetines tejidos"], [95, "Guirnalda de faroles"], [96, "Gnomo con esfera"],
      [97, "Gnomo y renos"], [98, "Duendecita"], [99, "Angelita"], [100, "Ángel navideño"],
      [101, "Patrón de pinos"], [102, "Esferas festivas"], [103, "Esferas colgantes"], [104, "Happy Holidays"]
    ];

    const STORAGE_KEY = "yaritza_card_rotations_v1";
    let rotations = {};
    try {
      rotations = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
    } catch {
      rotations = {};
    }

    let onlyRotated = false;
    const gridEl = document.getElementById("cards-grid");
    const countEl = document.getElementById("rotated-count");
    const exportPanel = document.getElementById("export-panel");
    const exportOutput = document.getElementById("export-output");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("is-visible");
      setTimeout(() => toastEl.classList.remove("is-visible"), 2200);
    }

    function saveRotations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rotations));
      updateSummary();
    }

    function buildExportObject() {
      const clean = {};
      for (const [n] of CARDS) {
        const id = "c" + n;
        const deg = rotations[id] || 0;
        if (deg !== 0) {
          clean[id] = deg;
        }
      }
      return clean;
    }

    function updateSummary() {
      const clean = buildExportObject();
      const total = Object.keys(clean).length;
      countEl.textContent = total === 1 ? "1 tarjeta girada" : total + " tarjetas giradas";
      exportOutput.value = JSON.stringify(clean, null, 2);
    }

    function renderGrid() {
      gridEl.innerHTML = "";
      for (const [n, name] of CARDS) {
        const id = "c" + n;
        const pad = String(n).padStart(3, "0");
        const deg = rotations[id] || 0;
        if (onlyRotated && deg === 0) continue;

        const card = document.createElement("div");
        card.className = "card-item" + (deg !== 0 ? " is-rotated" : "");
        card.title = "Haz clic para girar 90°";
        card.innerHTML =
          '<div class="card-header">' +
            '<span class="card-id">' + id + '</span>' +
            '<span class="card-num">#' + pad + '</span>' +
          '</div>' +
          '<div class="img-wrap">' +
            '<img src="/cards/' + pad + '.jpg" alt="' + name + '" loading="lazy" style="transform: rotate(' + deg + 'deg)" />' +
          '</div>' +
          '<div class="card-name">' + name + '</div>' +
          '<div class="rot-badge">' + (deg === 0 ? "0° (Original)" : "Girada: " + deg + "° ↻") + '</div>';

        card.addEventListener("click", () => {
          const next = ((rotations[id] || 0) + 90) % 360;
          if (next === 0) {
            delete rotations[id];
          } else {
            rotations[id] = next;
          }
          saveRotations();
          if (onlyRotated && next === 0) {
            renderGrid();
          } else {
            const img = card.querySelector("img");
            const badge = card.querySelector(".rot-badge");
            img.style.transform = "rotate(" + next + "deg)";
            badge.textContent = next === 0 ? "0° (Original)" : "Girada: " + next + "° ↻";
            card.classList.toggle("is-rotated", next !== 0);
          }
        });

        gridEl.appendChild(card);
      }
    }

    document.getElementById("filter-all").addEventListener("click", (e) => {
      onlyRotated = false;
      e.currentTarget.classList.add("btn-active");
      document.getElementById("filter-rotated").classList.remove("btn-active");
      renderGrid();
    });

    document.getElementById("filter-rotated").addEventListener("click", (e) => {
      onlyRotated = true;
      e.currentTarget.classList.add("btn-active");
      document.getElementById("filter-all").classList.remove("btn-active");
      renderGrid();
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("¿Seguro que deseas reiniciar todas las rotaciones a 0°?")) {
        rotations = {};
        saveRotations();
        renderGrid();
        showToast("Rotaciones reiniciadas a 0°");
      }
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      updateSummary();
      exportPanel.classList.add("is-open");
      exportOutput.select();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(exportOutput.value).then(() => {
          showToast("¡Correcciones copiadas al portapapeles!");
        }).catch(() => {});
      }
    });

    document.getElementById("btn-copy").addEventListener("click", () => {
      exportOutput.select();
      navigator.clipboard.writeText(exportOutput.value).then(() => {
        showToast("¡Listado copiado al portapapeles!");
      });
    });

    document.getElementById("btn-close-export").addEventListener("click", () => {
      exportPanel.classList.remove("is-open");
    });

    updateSummary();
    renderGrid();
  </script>
</body>
</html>
